name: CPCB Hourly Air Quality Ingestion

on:
  schedule:
    # Runs at the start of every hour (00:00, 01:00, 02:00, etc. UTC)
    - cron: '0 * * * *'
  # Allows manual triggering directly from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dotenv

      - name: Fetch Hourly CPCB Snapshot
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python fetch_data.py

      - name: Commit and Push New Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "No new files or changes to commit."
          else
            git commit -m "Auto: Ingest CPCB hourly snapshot [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
